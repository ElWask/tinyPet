<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Procedural Pet</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <canvas id="petCanvas" width="200" height="200"></canvas>

  <!-- Icons are inline SVG so everything stays code-drawn -->
  <svg width="0" height="0" style="position:absolute">
    <symbol id="i-apple" viewBox="0 0 16 16">
      <path fill="currentColor" d="M8 4.6C6.8 3.6 3.3 3.4 3.3 7.3c0 3 2.1 5.6 3.4 5.6.6 0 .8-.3 1.3-.3s.7.3 1.3.3c1.3 0 3.4-2.6 3.4-5.6 0-3.9-3.5-3.7-4.7-2.7z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M8 4.6c0-1.2.5-2.3 1.9-2.8"/>
    </symbol>
    <symbol id="i-heart" viewBox="0 0 16 16">
      <path fill="currentColor" d="M8 13.6S2 9.9 2 6.1C2 4.3 3.4 3 5 3c1.2 0 2.3.7 3 1.7C8.7 3.7 9.8 3 11 3c1.6 0 3 1.3 3 3.1 0 3.8-6 7.5-6 7.5z"/>
    </symbol>
    <symbol id="i-moon" viewBox="0 0 16 16">
      <path fill="currentColor" d="M13.4 10.3A5.6 5.6 0 0 1 5.7 2.6a5.6 5.6 0 1 0 7.7 7.7z"/>
    </symbol>
    <symbol id="i-sun" viewBox="0 0 16 16">
      <circle cx="8" cy="8" r="3" fill="currentColor"/>
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
            d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/>
    </symbol>
    <symbol id="i-sound" viewBox="0 0 16 16">
      <path fill="currentColor" d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10.5 5.8a3 3 0 0 1 0 4.4M12.4 4a5.5 5.5 0 0 1 0 8"/>
    </symbol>
    <symbol id="i-muted" viewBox="0 0 16 16">
      <path fill="currentColor" d="M2.5 6h2.2L8 3.2v9.6L4.7 10H2.5z"/>
      <path fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" d="M10.5 6l3.5 4M14 6l-3.5 4"/>
    </symbol>
  </svg>

  <div class="panel" id="panel">
    <button class="mute" id="mute" title="Sound on/off"><svg><use href="#i-sound"/></svg></button>
    <div class="stat food" id="stat-food" title="Food">
      <svg><use href="#i-apple"/></svg><div class="bar"><div class="fill"></div></div>
    </div>
    <div class="stat fun" id="stat-fun" title="Fun">
      <svg><use href="#i-heart"/></svg><div class="bar"><div class="fill"></div></div>
    </div>
    <div class="stat nrg" id="stat-energy" title="Energy">
      <svg><use href="#i-moon"/></svg><div class="bar"><div class="fill"></div></div>
    </div>

    <div class="actions">
      <button id="feed"><svg><use href="#i-apple"/></svg>Feed</button>
      <button id="play"><svg><use href="#i-heart"/></svg>Play</button>
      <button id="sleep"><svg><use href="#i-moon"/></svg><span>Sleep</span></button>
    </div>
  </div>


  <script src="js/core.js"></script>
  <script src="js/vendor/zzfx.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/pet.js"></script>
  <script src="js/draw.js"></script>
  <script src="js/input.js"></script>
  <script src="js/panel.js"></script>
  <script src="js/window.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
